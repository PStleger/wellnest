name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/wellnest
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: End-to-end, accessibility & Lighthouse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wellnest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (desktop + mobile, axe on every page)
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Lighthouse CI
        run: |
          pnpm start --port 3200 &
          npx wait-on http://localhost:3200
          npx -y @lhci/cli@0.15.1 autorun
        env:
          BETTER_AUTH_URL: http://localhost:3200
          NEXT_PUBLIC_SITE_URL: http://localhost:3200
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 14
